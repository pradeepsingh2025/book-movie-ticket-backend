spring.application.name=book-your-show-backend

server.port=${PORT:8000}

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${ACCESS_TOKEN_EXPIRATION:3600}
jwt.refresh-token-expiration=${REFRESH_TOKEN_EXPIRATION:604800}
jwt.secure=false
admin.signup.secret=${ADMIN_SIGNUP_SECRET}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true

