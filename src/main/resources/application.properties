spring.application.name=book-your-show-backend

server.port=${PORT:8000}

jwt.secret=${JWT_SECRET:1b6e8cf023abf576602f1400a41dc3a0e8f212051783c839d0a2f7f7dab10036862b66542be6288ac0aadc79bc3cc7aca1d44599ead4fc7fb276d8c695135535}
jwt.access-token-expiration=${ACCESS_TOKEN_EXPIRATION:3600}
jwt.refresh-token-expiration=${REFRESH_TOKEN_EXPIRATION:604800}
jwt.secure=false

# ===============================
# PostgreSQL Configuration
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Flyway
# ===============================
spring.flyway.enabled=true

